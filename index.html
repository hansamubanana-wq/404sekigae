<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#02030a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="404席替え" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>404 席替え</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="404 席替え" />
<meta property="og:image" content="https://404sekigae.vercel.app/icons/ogp.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Shippori+Mincho:wght@800&family=DotGothic16&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<canvas id="scene"></canvas>
<div id="frontImpactFlash" aria-hidden="true" hidden></div>

<header class="hud">
  <div class="brand">
    <div class="logo"><span class="logo-num">404</span><span class="logo-txt">席替え</span></div>
    <div class="status" id="status"></div>
  </div>
  <div class="seat-tools" id="seatTools" aria-label="席の操作" hidden>
    <div class="seat-modes" role="group" aria-label="操作モード">
      <button type="button" data-mode="lock" aria-pressed="false">選んだ席をロック</button>
      <button type="button" data-mode="retry" aria-pressed="false">選んだ席でやり直し</button>
      <button type="button" data-mode="manual" aria-pressed="false">手動で入れ替え</button>
    </div>
    <div class="seat-actions" id="seatActions" hidden>
      <button type="button" id="clearSeatsBtn" hidden>選択を解除</button>
      <button type="button" id="runSelectedBtn" hidden disabled>実行</button>
      <button type="button" id="closeSeatModeBtn">閉じる</button>
    </div>
  </div>
  <div class="controls">
    <button class="icon" id="saveBtn" onclick="saveSeats()" title="保存" aria-label="保存">
      <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/></svg>
      <svg class="check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
    </button>
    <button class="icon" id="historyBtn" type="button" title="履歴" aria-label="履歴" aria-haspopup="dialog" aria-controls="seatHistory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v5h5M3.5 9a9 9 0 1 1-.2 5M12 7v5l3 2"/></svg>
    </button>
    <button class="icon" id="resetBtn" onclick="resetSeats()" title="元に戻す" aria-label="元に戻す">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="icon" id="printBtn" onclick="window.print()" title="印刷" aria-label="印刷">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
    </button>
    <button class="start" id="shuffleBtn" onclick="shuffleSeats()" disabled><span class="tri"></span>席替えスタート</button>
  </div>
</header>

<dialog class="seat-history" id="seatHistory" aria-labelledby="seatHistoryTitle">
  <header>
    <h2 id="seatHistoryTitle">席の履歴</h2>
    <form method="dialog"><button type="submit" autofocus>閉じる</button></form>
  </header>
  <p id="seatHistoryStatus" role="status"></p>
  <ul id="seatHistoryList"></ul>
</dialog>

<div class="loading" id="loading">
  <div class="ring" aria-hidden="true"></div>
  <div class="load-text" id="loadStage" role="status">1 / 5　教室とフォントを準備</div>
  <progress id="loadProgress" max="5" value="0" aria-label="読み込み進捗"></progress>
</div>

<main class="sheet-wrap">
  <div class="sheet-desk">教卓</div>
  <div id="sheet" class="sheet"></div>
</main>

<div id="mcIntro" class="mc-intro" hidden>
  <button type="button" class="mc-skip">スキップ</button>
  <div class="mc-subtitles" lang="ja" hidden>
    <div class="mc-previous" aria-hidden="true"><span class="mc-speaker">MC</span><span class="mc-text"></span></div>
    <div class="mc-current" aria-live="polite"><span class="mc-speaker">MC</span><span class="mc-text"></span></div>
  </div>
</div>
<div id="mcReaction" class="mc-subtitles mc-reaction" role="status" lang="en" hidden>
  <span class="mc-speaker">MC</span><span class="mc-text"></span>
</div>
<div id="mcBeatControls" role="group" aria-label="拍の調整" hidden>
  <button type="button" data-delta="-0.02" aria-label="拍を0.02秒早める">−0.02</button>
  <output aria-label="拍の補正値"></output>
  <button type="button" data-delta="0.02" aria-label="拍を0.02秒遅らせる">+0.02</button>
</div>
<script src="students.js"></script>
<script src="seat-mix.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
<script src="stage-arch.js"></script>
<script src="dj-booth.js"></script>
<script src="finale-fx.js"></script>
<script src="world.js"></script>
<script src="models.js"></script>
<script src="mc-model.js"></script>
<script src="mc-suit.js"></script>
<script src="mc.js"></script>
<script src="groove.js"></script>
<script src="extras.js"></script>
<script src="bomb.js"></script>
<script src="frontrow.js"></script>
<script src="pair.js"></script>
<script src="show.js"></script>
</body>
</html>
