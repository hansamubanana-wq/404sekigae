<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#02030a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="404席替え" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<title>404 席替え</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<canvas id="scene"></canvas>

<header class="hud">
  <div class="brand">
    <div class="logo"><span class="logo-num">404</span><span class="logo-txt">席替え</span></div>
    <div class="status" id="status"></div>
  </div>
  <div class="controls">
    <button class="icon" id="soundBtn" onclick="toggleSound()" title="音" aria-label="音のオン・オフ">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <button class="icon" id="saveBtn" onclick="saveSeats()" title="保存" aria-label="保存">
      <svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/></svg>
      <svg class="check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
    </button>
    <button class="icon" id="resetBtn" onclick="resetSeats()" title="元に戻す" aria-label="元に戻す">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="icon" id="printBtn" onclick="window.print()" title="印刷" aria-label="印刷">
      <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
    </button>
    <button class="start" id="shuffleBtn" onclick="shuffleSeats()"><span class="tri"></span>席替えスタート</button>
  </div>
</header>

<div class="loading" id="loading"><div class="ring"></div></div>

<main class="sheet-wrap">
  <div class="sheet-desk">教卓</div>
  <div id="sheet" class="sheet"></div>
</main>

<script src="students.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
<script src="world.js"></script>
<script src="models.js"></script>
<script src="extras.js"></script>
<script src="show.js"></script>
</body>
</html>
