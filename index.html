<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
<title>404 席替え</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>

<body>
<div class="app">
  <div class="header">
    <div class="status" id="status"></div>
    <div class="controls">
      <button id="shuffleBtn" onclick="shuffleSeats()">▶ 席替えスタート</button>
      <button class="secondary" id="saveBtn" onclick="saveSeats()">保存</button>
      <button class="secondary" id="resetBtn" onclick="resetSeats()">元に戻す</button>
      <button class="secondary" id="printBtn" onclick="window.print()">印刷</button>
    </div>
  </div>

  <div class="classroom">
    <div class="front"><div class="desk">教卓</div></div>
    <div id="grid" class="grid"></div>
  </div>
</div>

<div id="stage" class="stage"></div>

<script src="students.js"></script>
<script src="app.js"></script>
</body>
</html>
